<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anaya Parlor - Owner Panel</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      background: #f4f6f9;
      padding: 15px;
      color: #333;
    }

    header {
      background: #ff1493;
      color: white;
      text-align: center;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    h2 {
      font-size: 1.1rem;
      color: #ff1493;
      margin-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 6px;
    }

    label { font-size: 0.85rem; font-weight: bold; color: #555; display: block; margin: 8px 0 4px; }
    input[type="text"], input[type="file"] { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; outline: none; background: #fff; }

    .btn {
      background: #ff1493;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn.toggle-btn { background: #28a745; margin-top: 0; }
    .btn.closed-btn { background: #dc3545; }

    .booking-item {
      background: #fafafa;
      border-left: 4px solid #ff1493;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .chat-box {
      height: 180px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      background: #fff;
    }
    .msg { padding: 5px 8px; border-radius: 6px; margin-bottom: 5px; max-width: 85%; font-size: 0.8rem; }
    .msg.user { background: #f0f0f0; color: #333; margin-right: auto; }
    .msg.owner { background: #ff1493; color: white; margin-left: auto; }
  </style>
</head>
<body>

  <header>
    <h1>Owner Admin Dashboard</h1>
    <p style="font-size: 0.85rem;">Anaya Beauty Parlor Control Panel</p>
  </header>

  <!-- Parlor Status Toggle -->
  <div class="card">
    <h2>Shop Status Toggle</h2>
    <p style="font-size: 0.85rem; margin-bottom: 8px;">Current Status: <strong id="status-display">Loading...</strong></p>
    <button id="toggle-status-btn" class="btn toggle-btn" onclick="toggleParlorStatus()">Switch Status</button>
  </div>

  <!-- Add New Product -->
  <div class="card">
    <h2>Add New Product to Store</h2>
    <label>Product Name</label>
    <input type="text" id="prod-name" placeholder="e.g. Whitening Cream">
    <label>Price (PKR)</label>
    <input type="text" id="prod-price" placeholder="e.g. 1200">
    <label>Select Product Image File</label>
    <input type="file" id="prod-file" accept="image/*">
    <button class="btn" onclick="addProduct()">Publish Product</button>
  </div>

  <!-- Add Gallery Image -->
  <div class="card">
    <h2>Add Photo to Gallery</h2>
    <label>Photo Title</label>
    <input type="text" id="gal-title" placeholder="e.g. Bridal Makeup Result">
    <label>Select Photo File</label>
    <input type="file" id="gal-file" accept="image/*">
    <button class="btn" onclick="addGalleryImage()">Upload to Gallery</button>
  </div>

  <!-- Recent Bookings -->
  <div class="card">
    <h2>Customer Bookings</h2>
    <div id="bookings-list"><p style="font-size:0.85rem; color:#777;">No bookings received yet.</p></div>
  </div>

  <!-- Support Chat -->
  <div class="card">
    <h2>Live Support Chat</h2>
    <div id="admin-chat-box" class="chat-box"></div>
    <input type="text" id="admin-chat-msg" placeholder="Reply to customer...">
    <button class="btn" onclick="sendOwnerMessage()">Send Reply</button>
  </div>

  <script src="admin.js"></script>
</body>
</html>
