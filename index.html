<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anaya Beauty Parlor</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #fce4ec; color: #333; padding: 15px; }
    header { text-align: center; margin-bottom: 15px; }
    h1 { color: #c71585; margin-bottom: 5px; }
    
    .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; }
    .badge.open { background: #d4edda; color: #155724; }
    .badge.closed { background: #f8d7da; color: #721c24; }

    nav { display: flex; gap: 8px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
    nav button { background: white; border: 1px solid #ffb6c1; padding: 8px 14px; border-radius: 20px; font-weight: 600; color: #c71585; cursor: pointer; }
    
    .tab-content { display: none; background: white; padding: 15px; border-radius: 12px; border: 1px solid #ffb6c1; max-width: 600px; margin: 0 auto; }
    .tab-content.active { display: block; }

    ul { list-style: none; }
    li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ffe4e1; font-size: 0.9rem; }
    
    input, select { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ffb6c1; border-radius: 8px; }
    .btn { background: #c71585; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 5px; }
    
    .chat-container { height: 180px; overflow-y: auto; border: 1px solid #ffb6c1; padding: 8px; border-radius: 8px; margin-bottom: 8px; background: #fafafa; }
    .msg { padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; max-width: 85%; font-size: 0.85rem; }
    .msg.user { background: #ffe4e1; margin-left: auto; }
    .msg.owner { background: #c71585; color: white; margin-right: auto; }
    
    .hidden { display: none; }
    .card-pass { background: #fff0f5; border: 2px dashed #c71585; padding: 12px; border-radius: 10px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>Anaya Beauty Parlor</h1>
    <span id="status-badge" class="badge closed">● LOADING STATUS...</span>
  </header>

  <nav>
    <button onclick="switchTab('services')">Services</button>
    <button onclick="switchTab('booking')">Book Now</button>
    <button onclick="switchTab('products')">Products Store</button>
    <button onclick="switchTab('gallery')">Gallery</button>
    <button onclick="switchTab('chat')">Live Support</button>
  </nav>

  <!-- Services Tab -->
  <div id="services-tab" class="tab-content active">
    <h2 style="color:#c71585; margin-bottom:10px;">Our Services & Rates</h2>
    <ul id="services-list"></ul>
  </div>

  <!-- Booking Tab -->
  <div id="booking-tab" class="tab-content">
    <h2 style="color:#c71585; margin-bottom:10px;">Book Appointment</h2>
    <input type="text" id="cust-name" placeholder="Full Name">
    <input type="text" id="cust-phone" placeholder="Phone Number">
    <select id="cust-service"><option value="">-- Select Service --</option></select>
    
    <p style="font-size:0.85rem; margin: 10px 0 5px; font-weight:bold;">Pay 50 PKR Advance Token Fee:</p>
    <button class="btn" style="background:#6f2da8; margin-bottom:5px;" onclick="handleBooking('JazzCash')">Pay via JazzCash (0300-XXXXXXX)</button>
    <button class="btn" style="background:#37b34a;" onclick="handleBooking('EasyPaisa')">Pay via EasyPaisa (0300-XXXXXXX)</button>

    <div id="token-result" class="hidden">
      <div id="appointment-card" class="card-pass">
        <h3 style="color:#c71585;">Appointment Pass</h3>
        <p><strong>Token:</strong> <span id="token-num"></span></p>
        <p><strong>Name:</strong> <span id="pass-name"></span></p>
        <p><strong>Phone:</strong> <span id="pass-phone"></span></p>
        <p><strong>Service:</strong> <span id="pass-service"></span></p>
        <p><strong>Date & Time:</strong> <span id="pass-date"></span> at <span id="pass-time"></span></p>
      </div>
      <button class="btn" style="background:#007bff; margin-top:8px;" onclick="downloadAppointmentPass()">Download Pass Image</button>
      <button class="btn" style="background:#25d366; margin-top:5px;" onclick="sendWhatsAppConfirmation()">Confirm on WhatsApp</button>
    </div>
  </div>

  <!-- Products Tab -->
  <div id="products-tab" class="tab-content">
    <h2 style="color:#c71585; margin-bottom:10px;">Beauty Products</h2>
    <div id="products-list"></div>
  </div>

  <!-- Gallery Tab -->
  <div id="gallery-tab" class="tab-content">
    <h2 style="color:#c71585; margin-bottom:10px;">Photo Gallery</h2>
    <div id="gallery-list"></div>
  </div>

  <!-- Chat Tab -->
  <div id="chat-tab" class="tab-content">
    <h2 style="color:#c71585; margin-bottom:10px;">Live Chat Support</h2>
    <div id="chat-box" class="chat-container"></div>
    <input type="text" id="chat-msg" placeholder="Type message...">
    <button class="btn" onclick="sendMessage()">Send Message</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
