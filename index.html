<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anaya Beauty Parlor</title>

  <!-- Firebase SDKs & html2canvas -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      background: #fce4ec url('https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=1600&q=80') center/cover fixed;
      min-height: 100vh;
      padding: 15px;
      color: #333;
    }

    header {
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      padding: 18px;
      border-radius: 16px;
      max-width: 600px;
      margin: 0 auto 15px auto;
      border: 1px solid #ffb6c1;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      color: #ff1493;
      font-size: 2.1rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .badge.open { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .badge.closed { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    nav {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 15px auto;
      flex-wrap: wrap;
      max-width: 600px;
    }

    nav button {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #ffb6c1;
      padding: 9px 18px;
      border-radius: 20px;
      font-weight: 600;
      color: #ff1493;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    nav button:hover, nav button.active {
      background: #ff1493;
      color: white;
      border-color: #ff1493;
    }
    
    .tab-content {
      display: none;
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #ffb6c1;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    .tab-content.active { display: block; }

    h2 {
      color: #222;
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 15px;
      border-bottom: 2px solid #ffe4e1;
      padding-bottom: 6px;
    }

    ul { list-style: none; }
    
    .service-pill-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-radius: 30px;
      margin-bottom: 10px;
      background: #fff5f8;
      border: 1px solid #ffccd5;
    }

    .service-name {
      font-weight: 600;
      color: #222;
      font-size: 0.95rem;
    }

    .service-price-badge {
      background: #ff69b4;
      color: white;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 10px;
      border: 1px solid #ffb6c1;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus, select:focus { border-color: #ff1493; }

    .btn {
      background: #ff1493;
      color: white;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: 5px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn:hover { opacity: 0.95; }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .product-card, .gallery-card {
      background: white;
      border: 1px solid #ffb6c1;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .product-card img, .gallery-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product-card h3 {
      font-size: 1rem;
      color: #ff1493;
      margin: 6px 0 4px 0;
    }

    .chat-container {
      height: 200px;
      overflow-y: auto;
      border: 1px solid #ffb6c1;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .msg { padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; max-width: 85%; font-size: 0.85rem; }
    .msg.user { background: #ffe4e1; margin-left: auto; color: #d61c5a; }
    .msg.owner { background: #ff1493; color: white; margin-right: auto; }

    .hidden { display: none; }
    .card-pass {
      background: #fff0f5;
      border: 2px dashed #ff1493;
      padding: 14px;
      border-radius: 10px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Anaya Beauty Parlor</h1>
    <span id="status-badge" class="badge closed">● LOADING STATUS...</span>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('services', this)">Services</button>
    <button class="nav-btn" onclick="switchTab('booking', this)">Book Now</button>
    <button class="nav-btn" onclick="switchTab('products', this)">Products Store</button>
    <button class="nav-btn" onclick="switchTab('gallery', this)">Gallery</button>
    <button class="nav-btn" onclick="switchTab('chat', this)">Live Support</button>
  </nav>

  <!-- Services Tab -->
  <div id="services-tab" class="tab-content active">
    <h2>Our Services & Prices</h2>
    <ul id="services-list"></ul>
  </div>

  <!-- Booking Tab -->
  <div id="booking-tab" class="tab-content">
    <h2>Book Appointment</h2>
    <input type="text" id="cust-name" placeholder="Full Name">
    <input type="text" id="cust-phone" placeholder="Phone Number">
    <select id="cust-service"><option value="">-- Select Service --</option></select>
    
    <p style="font-size:0.85rem; margin: 10px 0 5px; font-weight:bold; color:#ff1493;">Pay 50 PKR Advance Token Fee:</p>
    <button class="btn" style="background:#6f2da8; margin-bottom:5px;" onclick="handleBooking('JazzCash')">Pay via JazzCash (03458970591)</button>
    <button class="btn" style="background:#37b34a;" onclick="handleBooking('EasyPaisa')">Pay via EasyPaisa (03458970591)</button>

    <div id="token-result" class="hidden">
      <div id="appointment-card" class="card-pass">
        <h3 style="color:#ff1493;">Appointment Pass</h3>
        <p><strong>Token:</strong> <span id="token-num"></span></p>
        <p><strong>Name:</strong> <span id="pass-name"></span></p>
        <p><strong>Phone:</strong> <span id="pass-phone"></span></p>
        <p><strong>Service:</strong> <span id="pass-service"></span></p>
        <p><strong>Date & Time:</strong> <span id="pass-date"></span> at <span id="pass-time"></span></p>
      </div>
      <button class="btn" style="background:#007bff; margin-top:8px;" onclick="downloadAppointmentPass()">Download Pass Image</button>
      <button class="btn" style="background:#25d366; margin-top:5px;" onclick="sendWhatsAppConfirmation()">Confirm on WhatsApp</button>
    </div>
  </div>

  <!-- Products Tab -->
  <div id="products-tab" class="tab-content">
    <h2>Beauty Products Store</h2>
    <div id="products-list" class="grid-container"></div>
  </div>

  <!-- Gallery Tab -->
  <div id="gallery-tab" class="tab-content">
    <h2>Photo Gallery</h2>
    <div id="gallery-list" class="grid-container"></div>
  </div>

  <!-- Chat Tab -->
  <div id="chat-tab" class="tab-content">
    <h2>Live Chat Support</h2>
    <div id="chat-box" class="chat-container"></div>
    <input type="text" id="chat-msg" placeholder="Type message...">
    <button class="btn" onclick="sendMessage()">Send Message</button>
  </div>

  <script src="script.js"></script>

  <script>
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`${tabId}-tab`)?.classList.add('active');
      if(btn) btn.classList.add('active');
    }
  </script>
</body>
</html>
